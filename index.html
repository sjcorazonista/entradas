<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="dns-prefetch" href="https://script.googleusercontent.com">
<title>Escáner Festival</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{margin:0;padding:0;background:#000;color:#fff;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-user-select:none;user-select:none;width:100%;height:100%;height:100dvh}
  #video{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;object-fit:cover;background:#000}
  #canvas{display:none}
  #target{position:fixed;top:42%;left:50%;width:72vw;max-width:340px;aspect-ratio:1/1;transform:translate(-50%,-50%);border:3px solid rgba(255,255,255,.85);border-radius:18px;box-shadow:0 0 0 99999px rgba(0,0,0,.35);pointer-events:none;transition:border-color .2s,box-shadow .2s}
  #target.found{border-color:#27ae60;box-shadow:0 0 0 99999px rgba(0,0,0,.5),0 0 30px #27ae60 inset}
  #overlay{position:fixed;left:0;right:0;bottom:0;padding:18px env(safe-area-inset-right) calc(18px + env(safe-area-inset-bottom)) env(safe-area-inset-left);text-align:center;background:rgba(52,73,94,.94);transition:background .15s;z-index:5}
  #overlay.ok{background:rgba(39,174,96,.97)}
  #overlay.usado{background:rgba(230,126,34,.97)}
  #overlay.invalido{background:rgba(192,57,43,.97)}
  #t{font-size:30px;font-weight:800;line-height:1.1;margin-bottom:6px}
  #s{font-size:17px;opacity:.95;line-height:1.3;word-break:break-word}
  #debug{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;background:rgba(0,0,0,.55);color:#9f9;font-size:11px;padding:4px 8px;border-radius:8px;z-index:8;font-family:monospace}
  #err{position:fixed;top:env(safe-area-inset-top);left:0;right:0;background:#c0392b;padding:20px;text-align:center;display:none;font-size:15px;line-height:1.4;z-index:10}
  #start{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#27ae60;color:#fff;border:0;padding:18px 30px;border-radius:30px;font-size:18px;font-weight:700;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.4);display:none}
</style>
</head>
<body>
<video id="video" playsinline autoplay muted></video>
<canvas id="canvas"></canvas>
<div id="target"></div>
<div id="debug">esperando…</div>
<div id="err"></div>
<button id="start">Activar cámara</button>
<div id="overlay" class="idle"><div id="t">Apunta al QR</div><div id="s">Cámara activa</div></div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzCaHnFykQbJWRzL4JoeblBV5Bvfn1O5XCNw1olycTcd0ob09jC_tTh_QxkGX5nHpo/exec';
const SECRET = 'EscanerCorazonista++sdfñjewnasdferaskljnkijbh++';

const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const overlay = document.getElementById('overlay');
const target = document.getElementById('target');
const startBtn = document.getElementById('start');
const errBox = document.getElementById('err');
const dbg = document.getElementById('debug');

let busy = false, lastId = null, lastTime = 0, scanning = false;
let frames = 0, fpsTime = Date.now();

let nativeDetector = null;
if ('BarcodeDetector' in window) {
  try { nativeDetector = new BarcodeDetector({ formats: ['qr_code'] }); } catch(_){}
}

function show(cls, t, s) {
  overlay.className = cls;
  document.getElementById('t').textContent = t;
  document.getElementById('s').textContent = s;
}

function reset() {
  busy = false;
  target.classList.remove('found');
  show('idle', 'Apunta al QR', 'Cámara activa');
}

function extractId(text) {
  const m = text.match(/[?&]id=([^&\s]+)/);
  if (m) return decodeURIComponent(m[1]);
  if (/^FEST-/.test(text.trim())) return text.trim();
  return null;
}

function handle(text) {
  const id = extractId(text);
  if (!id) {
    show('invalido', 'QR no reconocido', text.slice(0, 60));
    target.classList.add('found');
    target.style.borderColor = '#c0392b';
    setTimeout(function(){ target.style.borderColor=''; reset(); }, 1800);
    return;
  }
  const now = Date.now();
  if (busy || (id === lastId && now - lastTime < 1500)) return;
  busy = true; lastId = id; lastTime = now;
  target.classList.add('found');
  if (navigator.vibrate) navigator.vibrate(80);
  show('idle', 'Comprobando…', id);

  fetch(SCRIPT_URL + '?id=' + encodeURIComponent(id) + '&json=1&t=' + encodeURIComponent(SECRET), { cache: 'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(r){
      show(r.status || 'invalido', r.titulo || 'ERROR', r.sub || '');
      if (navigator.vibrate) navigator.vibrate(r.status === 'ok' ? [80,40,80] : [350]);
      setTimeout(reset, 1200);
    })
    .catch(function(e){
      show('invalido', 'ERROR DE RED', e.message || 'No se pudo conectar');
      setTimeout(reset, 1200);
    });
}

async function tick() {
  if (!scanning) return;
  if (video.readyState >= 2 && !busy) {
    const w = video.videoWidth, h = video.videoHeight;
    if (w > 0 && h > 0) {
      try {
        if (nativeDetector) {
          const codes = await nativeDetector.detect(video);
          if (codes.length) handle(codes[0].rawValue);
        } else {
          const size = Math.min(w, h);
          const sx = (w - size) / 2, sy = (h - size) / 2;
          const T = 400;
          canvas.width = T; canvas.height = T;
          ctx.drawImage(video, sx, sy, size, size, 0, 0, T, T);
          const data = ctx.getImageData(0, 0, T, T);
          const code = jsQR(data.data, T, T, { inversionAttempts: 'attemptBoth' });
          if (code && code.data) handle(code.data);
        }
        frames++;
        if (Date.now() - fpsTime > 1000) {
          dbg.textContent = w + '×' + h + ' · ' + frames + ' fps · ' + (nativeDetector ? 'nativo' : 'jsQR');
          frames = 0; fpsTime = Date.now();
        }
      } catch (e) { dbg.textContent = 'err: ' + e.message; }
    }
  }
  requestAnimationFrame(tick);
}

async function start() {
  startBtn.style.display = 'none';
  show('idle', 'Activando cámara…', '1 segundo');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });
    video.srcObject = stream;
    video.setAttribute('playsinline', '');
    await video.play();

    // Bloquear zoom al mínimo y enfoque continuo (evita ultra-wide en iPhones)
    const track = stream.getVideoTracks()[0];
    try {
      const caps = track.getCapabilities ? track.getCapabilities() : {};
      const adv = [];
      if (caps.focusMode && caps.focusMode.includes('continuous')) adv.push({ focusMode: 'continuous' });
      if (caps.zoom) adv.push({ zoom: caps.zoom.min });
      if (adv.length) await track.applyConstraints({ advanced: adv });
    } catch(_) {}

    scanning = true;
    show('idle', 'Apunta al QR', 'Aléjate 15-20 cm si no enfoca');
    requestAnimationFrame(tick);
  } catch (e) {
    errBox.style.display = 'block';
    errBox.textContent = 'No puedo acceder a la cámara: ' + e.message;
    startBtn.style.display = 'block';
  }
}

startBtn.onclick = start;

// Tocar el vídeo fuerza un re-enfoque puntual
video.addEventListener('click', async function(){
  const stream = video.srcObject;
  if (!stream) return;
  const track = stream.getVideoTracks()[0];
  try {
    await track.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
    setTimeout(function(){ track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); }, 600);
  } catch(_) {}
});

// iOS exige gesto de usuario para activar la cámara; Android arranca solo
if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
  startBtn.style.display = 'block';
  show('idle', 'Activa la cámara', 'Pulsa el botón verde');
} else {
  start();
}
</script>
</body>
</html>
